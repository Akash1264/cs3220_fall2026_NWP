        <style type="text/css">

             #mynetwork {
                 width: 100%;
                 height: 550px;
                 background-color: #ffffff;

    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#f8b4b4", "font": {"size": 22}, "id": "A", "label": "A", "shape": "circle", "title": "A: domain = [1, 2, 3, 4, 5, 6]"}, {"color": "#f8b4b4", "font": {"size": 22}, "id": "B", "label": "B", "shape": "circle", "title": "B: domain = [1, 2, 3, 4, 5, 6]"}, {"color": "#f8b4b4", "font": {"size": 22}, "id": "C", "label": "C", "shape": "circle", "title": "C: domain = [1, 2, 3, 4, 5, 6]"}, {"color": "#bfe3c0", "font": {"size": 22}, "id": "D", "label": "D", "shape": "circle", "title": "D: domain = [1, 2, 3, 4, 5, 6]"}, {"color": "#f8b4b4", "font": {"size": 22}, "id": "E", "label": "E", "shape": "circle", "title": "E: domain = [1, 2, 3, 4, 5, 6]"}]);
                  edges = new vis.DataSet([{"color": "red", "from": "A", "label": "A despises B", "title": "different chairs AND not adjacent", "to": "B", "width": 4}, {"color": "#bbbbbb", "from": "A", "title": "different chairs (AllDifferent)", "to": "C", "width": 1}, {"color": "#bbbbbb", "from": "A", "title": "different chairs (AllDifferent)", "to": "D", "width": 1}, {"color": "#bbbbbb", "from": "A", "title": "different chairs (AllDifferent)", "to": "E", "width": 1}, {"color": "red", "from": "B", "label": "C is B\u0027s manager", "title": "different chairs AND not adjacent", "to": "C", "width": 4}, {"color": "#bbbbbb", "from": "B", "title": "different chairs (AllDifferent)", "to": "D", "width": 1}, {"color": "red", "from": "B", "label": "B argues with E", "title": "different chairs AND not adjacent", "to": "E", "width": 4}, {"color": "#bbbbbb", "from": "C", "title": "different chairs (AllDifferent)", "to": "D", "width": 1}, {"color": "#bbbbbb", "from": "C", "title": "different chairs (AllDifferent)", "to": "E", "width": 1}, {"color": "#bbbbbb", "from": "D", "title": "different chairs (AllDifferent)", "to": "E", "width": 1}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
