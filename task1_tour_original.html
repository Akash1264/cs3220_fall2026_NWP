                  nodes = new vis.DataSet([{"color": "white", "font": {"color": "white"}, "id": "Stanley Park", "label": "Stanley Park\n{Mon, Tue, Wed, Thu, Fri, Sat, Sun}", "shape": "dot", "size": 20, "title": "Mon, Tue, Wed, Thu, Fri, Sat, Sun", "x": 1.8369701987210297e-14, "y": -300.0}, {"color": "yellow", "font": {"color": "white"}, "id": "Granville Island", "label": "Granville Island\n{Tue}", "shape": "dot", "size": 20, "title": "Tue", "x": 234.54944474040894, "y": -187.04694055762005}, {"color": "white", "font": {"color": "white"}, "id": "Vancouver Aquarium", "label": "Vancouver Aquarium\n{Mon, Tue, Wed, Thu, Fri, Sat, Sun}", "shape": "dot", "size": 20, "title": "Mon, Tue, Wed, Thu, Fri, Sat, Sun", "x": 292.4783736545471, "y": 66.75628018689432}, {"color": "white", "font": {"color": "white"}, "id": "Science World", "label": "Science World\n{Mon, Tue, Wed, Thu, Fri, Sat, Sun}", "shape": "dot", "size": 20, "title": "Mon, Tue, Wed, Thu, Fri, Sat, Sun", "x": 130.16512173526746, "y": 270.29066037072573}, {"color": "white", "font": {"color": "white"}, "id": "Gastown", "label": "Gastown\n{Mon, Tue, Wed, Thu, Fri, Sat, Sun}", "shape": "dot", "size": 20, "title": "Mon, Tue, Wed, Thu, Fri, Sat, Sun", "x": -130.1651217352674, "y": 270.29066037072573}, {"color": "yellow", "font": {"color": "white"}, "id": "Capilano Suspension Bridge", "label": "Capilano Suspension Bridge\n{Wed}", "shape": "dot", "size": 20, "title": "Wed", "x": -292.4783736545471, "y": 66.75628018689436}, {"color": "white", "font": {"color": "white"}, "id": "Canada Place", "label": "Canada Place\n{Mon, Tue, Wed, Thu, Fri, Sat, Sun}", "shape": "dot", "size": 20, "title": "Mon, Tue, Wed, Thu, Fri, Sat, Sun", "x": -234.54944474040897, "y": -187.04694055762002}]);

88888", "from": "Canada Place", "title": "Canada Place != Granville Island", "to": "Granville Island"}, {"color": "#888888", "from": "Canada Place", "title": "Canada Place != Vancouver Aquarium", "to": "Vancouver Aquarium"}, {"color": "#888888", "from": "Canada Place", "title": "Canada Place != Science World", "to": "Science World"}, {"color": "#888888", "from": "Canada Place", "title": "Canada Place != Gastown", "to": "Gastown"}, {"color": "#888888", "from": "Canada Place", "title": "Canada Place != Capilano Suspension Bridge", "to": "Capilano Suspension Bridge"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": false,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
